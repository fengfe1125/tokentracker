name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装差分语料依赖
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Python CLI、扫描核心与差分基线
        run: python -m unittest discover -s tests -v

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装差分语料依赖
        run: brew install zstd
      - name: Swift Core 与 App 测试
        run: swift test --package-path swift
      - name: 构建 SwiftUI App
        run: ./scripts/build_swift_app.sh
      - name: 校验产物
        run: |
          test -x dist/TokenTracker.app/Contents/MacOS/TokenTracker
          codesign --verify --deep --strict dist/TokenTracker.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/TokenTracker.app/Contents/Info.plist)" = "com.tokentracker.desktop.v2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' dist/TokenTracker.app/Contents/Info.plist)" = "true"
          cmp assets/icon.icns dist/TokenTracker.app/Contents/Resources/icon.icns
          python3 scripts/check_icon.py
          git diff --exit-code -- assets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装差分语料依赖
        shell: pwsh
        run: if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) { choco install zstandard -y --no-progress }
      - name: 构建
        run: dotnet build windows/TokenTracker.Windows.sln -c Release
      - name: Core 测试（含 Python 差分基线）
        env:
          PYTHONUTF8: "1"
        run: dotnet test windows/TokenTracker.Windows.sln -c Release --no-build
      - name: 发布 zip
        shell: pwsh
        run: ./windows/scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TokenTracker-win-x64
          path: dist/TokenTracker-*-win-x64.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 语法检查（零依赖）
        run: |
          node --check web/worker/src/index.js
          node --check web/worker/src/validate.js
          bash -n web/worker/setup.sh
      - name: 载荷校验器回归
        run: node tests/test_web.js
