<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenTracker</title>
<link rel="icon" href="/app/brand.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app/brand.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/chart.umd.min.js"></script>
</head>
<body>

<header class="titlebar drag">
  <div class="tl-left"></div>
  <div class="tl-title"><span class="tl-mark tt-brand" aria-hidden="true"></span>TokenTracker<span class="tl-sub">本地 · 私密</span></div>
  <div class="tl-right"><span id="updatedAt">—</span><span class="live-dot" id="liveDot"></span></div>
  <div class="loadbar" id="loadbar"></div>
</header>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark tt-brand" aria-hidden="true"></span>
      <div>
        <div class="brand-name">TokenTracker</div>
        <div class="brand-sub">7 个 AI 工具用量统计</div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        概览
      </button>
      <button class="nav-item" data-view="sessions">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 6h12M7 12h12M7 18h8"/><circle cx="4.2" cy="6" r="1.3" fill="currentColor"/><circle cx="4.2" cy="12" r="1.3" fill="currentColor"/><circle cx="4.2" cy="18" r="1.3" fill="currentColor"/></svg>
        会话记录
      </button>
    </nav>

    <div class="side-label">工具数据源（点击查看会话）</div>
    <div class="side-tools" id="sideTools"></div>

    <div class="side-foot">
      <div class="today-cost">
        <span>今日成本</span>
        <b id="todayCost">$—</b>
      </div>
      <button class="scan-btn" id="scanBtn">
        <svg viewBox="0 0 24 24" fill="none" class="scan-ico"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>扫描日志</span>
      </button>
    </div>
  </aside>

  <main class="main" id="main">

    <!-- ═══════════ 概览 ═══════════ -->
    <section class="view" id="view-overview">
      <div class="page-head">
        <div class="page-title">
          <h1>用量概览</h1>
          <p>数据 100% 读取本机各工具日志，不上传任何内容</p>
        </div>
        <div class="range-chips" id="rangeChips">
          <i class="chip-ink" id="rangeInk"></i>
          <button data-range="day">今天</button>
          <button data-range="week" class="on">本周</button>
          <button data-range="month">本月</button>
          <button data-range="all">全部</button>
        </div>
      </div>

      <div class="cards" id="statCards"></div>
      <p class="time-quality" id="timeQuality" aria-live="polite"></p>

      <div class="grid2">
        <div class="card chart-card">
          <div class="card-head">
            <h2>每日趋势</h2>
            <div class="chart-tools">
              <button class="mini-btn" id="yToggle">Y 轴 · 线性</button>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="trendChart" height="228"></canvas></div>
          <div class="legend" id="chartLegend"></div>
          <p class="time-quality" id="trendQuality"></p>
        </div>

        <div class="card quota-card">
          <div class="card-head">
            <h2>订阅配额</h2>
            <span class="hint">固定窗口 · 官方优先</span>
          </div>
          <div class="quota-list" id="quotaList"></div>
        </div>
      </div>

      <div class="card model-card">
        <div class="card-head"><h2>模型用量 Top</h2><span class="hint">总 Token（含缓存读写）；* 为时间估算/未分配</span></div>
        <div id="modelList"></div>
      </div>
    </section>

    <!-- ═══════════ 会话 ═══════════ -->
    <section class="view hidden" id="view-sessions">
      <div class="page-head">
        <div class="page-title">
          <h1>会话记录</h1>
          <p id="sessSub">—</p>
          <p class="time-quality">* 表示按观测时间估算或未分配；悬停查看，详情保留会话全部历史。</p>
        </div>
        <div class="filter-chips" id="toolFilter"></div>
      </div>
      <div class="card table-card">
        <table>
          <thead><tr>
            <th class="sortable" data-sort="tool">工具</th>
            <th class="sortable" data-sort="project">会话 / 项目</th>
            <th class="sortable" data-sort="model">模型</th>
            <th class="sortable" data-sort="ts">最后活跃</th>
            <th class="num sortable" data-sort="tokens">总 Token</th>
            <th class="num sortable" data-sort="input">输入</th>
            <th class="num sortable" data-sort="output">输出</th>
            <th class="num sortable" data-sort="cache_read">缓存读</th>
            <th class="num sortable" data-sort="cache_write">缓存写</th>
            <th class="num sortable" data-sort="cost">成本</th>
            <th class="num sortable" data-sort="events">事件</th>
          </tr></thead>
          <tbody id="sessBody"></tbody>
        </table>
        <div class="empty" id="sessEmpty">暂无量测数据，点击「扫描日志」开始。</div>
      </div>
    </section>

  </main>
</div>

<!-- 会话详情抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="d-title"><h3 id="dTitle">会话详情</h3><p id="dSub">—</p></div>
    <button class="drawer-close" id="drawerClose" title="关闭 (Esc)">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
